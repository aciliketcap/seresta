services:
  serespar:
    image: playwright:localbuild-noble-20260113-v1.57.0
    container_name: serespar
    environment:
      - DISPLAY
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./../serespar/:/opt/serespar
    working_dir: /test
    command: /test/run-test.sh
    depends_on:
      - nginx

  nginx:
    image: nginx:latest
    volumes:
      - ./stub-site/:/usr/share/nginx/html:ro
    ports:
      # Not needed by the test (that goes over the compose network), but lets
      # you open the stub at http://localhost:8080/ while debugging.
      - "8080:80"

