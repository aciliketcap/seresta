[project]
name = "serespar"
version = "0.1.0"
description = "Search Results Parser - A scraper powered by Playwright"
authors = [
    { name = "Sinan Akpolat", email = "aciliketcap@gmail.com" }
]
requires-python = "==3.12.3"
dependencies = [
    "pydantic>=2.13.3",
    "pydantic-settings>=2.7.0"
]

# `serespar.db.postgres` only. Nothing in `serespar/__init__.py` imports it, so
# a parser that persists some other way -- or the test suite, which persists
# nothing -- does not pull SQLAlchemy in.
[project.optional-dependencies]
postgres = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
